<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ангелина и таблица умножения</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: linear-gradient(#8fd9ff 0 35%, #5fb84a 35% 100%);
    font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden;
  }
  #gameWrap {
    width: min(100vw, 980px);
    padding: 14px;
    background: rgba(255,255,255,0.2);
    border-radius: 40px;
    backdrop-filter: blur(2px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  #topbar {
    display: flex; gap: 12px; justify-content: space-between; align-items: center;
    background: rgba(255,255,248,0.92);
    border-radius: 20px; padding: 10px 22px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    flex-wrap: wrap;
  }
  #title { font-weight: 800; font-size: 20px; color: #1e3a1a; letter-spacing: -0.3px; }
  .stat { font-weight: 700; color: #1d3a1d; background: #eaf8e0; padding: 4px 16px; border-radius: 40px; }
  select {
    font-weight: 700; padding: 6px 14px; border-radius: 40px;
    border: 2px solid #3f7a3a; background: #fafff0; font-size: 16px;
    cursor: pointer; outline: none;
  }
  canvas {
    width: 100%; aspect-ratio: 16/10; display: block; border-radius: 28px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.25);
    background: #79c75a; cursor: none;
    touch-action: none;
  }
  #hint {
    text-align: center; color: #fff; text-shadow: 0 2px 8px #1f3d1a;
    margin: 10px 0 0; font-weight: 600; font-size: 15px;
  }
  #modal {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: rgba(12, 30, 10, 0.55);
    backdrop-filter: blur(4px);
    z-index: 10;
  }
  #card {
    width: min(92vw, 400px); background: #fefcf2;
    border-radius: 32px; padding: 30px 22px;
    text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    border: 3px solid #b3d9a2;
  }
  #example { font-size: 48px; font-weight: 900; margin: 10px 0; color: #1f3a1a; }
  #answer {
    width: 100%; font-size: 32px; text-align: center; padding: 12px;
    border: 3px solid #8bb07a; border-radius: 16px; outline: none;
    background: #fafff5;
  }
  #check {
    margin-top: 16px; width: 100%; padding: 14px; border: 0; border-radius: 16px;
    background: #2a4a22; color: #fff; font-size: 20px; font-weight: 800;
    cursor: pointer; transition: 0.1s;
  }
  #check:active { transform: scale(0.96); background: #1d3617; }
  #message { min-height: 28px; margin-top: 12px; font-weight: 700; font-size: 18px; }
  .hidden { display: none !important; }
  .victory-badge {
    background: #f5d742; color: #1f3a1a; padding: 4px 20px;
    border-radius: 60px; font-weight: 800;
  }
</style>
</head>
<body>
<div id="gameWrap">
  <div id="topbar">
    <div id="title">🐸 Ангелина × таблица умножения</div>
    <div>
      <select id="multiplierSelect">
        <option value="2">× 2</option>
        <option value="3">× 3</option>
        <option value="4">× 4</option>
        <option value="5" selected>× 5</option>
        <option value="6">× 6</option>
        <option value="7">× 7</option>
        <option value="8">× 8</option>
        <option value="9">× 9</option>
      </select>
    </div>
    <div class="stat">🐸 <span id="score">0</span> / 10</div>
    <div class="stat" id="levelDisplay">Уровень 1</div>
  </div>
  <canvas id="game" width="960" height="600"></canvas>
  <div id="hint">🎯 Управляй мышкой • Подойди к лягушке и реши пример</div>
</div>

<div id="modal" class="hidden">
  <div id="card">
    <div style="font-size: 44px;">🐸</div>
    <div style="font-weight: 700; font-size: 18px;">Реши пример, чтобы поймать!</div>
    <div id="example"></div>
    <input id="answer" type="number" inputmode="numeric" autocomplete="off" placeholder="?" />
    <button id="check">Поймать!</button>
    <div id="message"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// DOM
const scoreSpan = document.getElementById('score');
const levelSpan = document.getElementById('levelDisplay');
const modal = document.getElementById('modal');
const exampleDiv = document.getElementById('example');
const answerInput = document.getElementById('answer');
const msgDiv = document.getElementById('message');
const multiplierSelect = document.getElementById('multiplierSelect');

// Состояние
let score = 0;
let level = 1;
let multiplier = 5; // по умолчанию
let totalFrogs = 10;
let frogs = [];
let player = { x: W * 0.5, y: H * 0.65 };
let mouseX = player.x, mouseY = player.y;
let activeFrog = null;
let question = null;
let caughtAnim = 0;
let victory = false;
let victoryTimer = 0;
let gameActive = true;

// Подписка на мышь
let mouseInside = true;

// --- Инициализация лягушек ---
function spawnFrog(avoidPlayer = true) {
  let x, y, ok;
  let attempts = 0;
  do {
    x = 50 + Math.random() * (W - 100);
    y = 120 + Math.random() * (H - 180);
    ok = true;
    if (avoidPlayer && Math.hypot(x - player.x, y - player.y) < 120) ok = false;
    for (const f of frogs) {
      if (Math.hypot(x - f.x, y - f.y) < 70) { ok = false; break; }
    }
    attempts++;
  } while (!ok && attempts < 300);
  return { x, y, phase: Math.random() * Math.PI * 2, id: Math.random() };
}

function initLevel() {
  victory = false;
  victoryTimer = 0;
  score = 0;
  gameActive = true;
  frogs = [];
  for (let i = 0; i < totalFrogs; i++) {
    frogs.push(spawnFrog(true));
  }
  player.x = W * 0.5;
  player.y = H * 0.65;
  mouseX = player.x;
  mouseY = player.y;
  updateUI();
  modal.classList.add('hidden');
  activeFrog = null;
  question = null;
}

// --- Обновление UI ---
function updateUI() {
  scoreSpan.textContent = score;
  levelSpan.textContent = `Уровень ${level}`;
  if (victory) {
    levelSpan.textContent = `🎉 Уровень ${level} пройден! 🎉`;
  }
}

// --- Рисование ---
function roundRect(x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
}

function drawField() {
  // Небо-трава
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#b3e2fa');
  grad.addColorStop(0.3, '#9dd68a');
  grad.addColorStop(0.45, '#78c75a');
  grad.addColorStop(1, '#5caa42');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Холмы
  ctx.fillStyle = '#6db351';
  ctx.beginPath();
  ctx.moveTo(0, 160);
  for (let x = 0; x <= W; x += 70) {
    ctx.quadraticCurveTo(x + 35, 130 + Math.sin(x * 0.03) * 22, x + 70, 160);
  }
  ctx.lineTo(W, 0);
  ctx.lineTo(0, 0);
  ctx.fill();

  // Цветочки
  for (let i = 0; i < 40; i++) {
    const x = (i * 97 + 23) % W;
    const y = 130 + (i * 63) % (H - 150);
    ctx.fillStyle = i % 3 === 0 ? '#fcf0b5' : (i % 3 === 1 ? '#e8d4ff' : '#ffd9d9');
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#6b8f4a';
    ctx.beginPath();
    ctx.arc(x + 1, y + 6, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Трава
  for (let i = 0; i < 120; i++) {
    const x = (i * 73 + 11) % W;
    const y = 140 + (i * 37) % (H - 150);
    ctx.strokeStyle = i % 2 ? 'rgba(50,110,40,0.2)' : 'rgba(200,230,170,0.2)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(x, y + 8);
    ctx.lineTo(x + 2, y);
    ctx.stroke();
  }

  // Тропинка
  ctx.strokeStyle = 'rgba(210,185,120,0.35)';
  ctx.lineWidth = 70;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(W * 0.5, H + 20);
  ctx.bezierCurveTo(W * 0.3, H * 0.7, W * 0.75, H * 0.4, W * 0.55, 120);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(235,210,150,0.3)';
  ctx.lineWidth = 45;
  ctx.stroke();
}

function drawFrog(f) {
  const bob = Math.sin(performance.now() / 280 + f.phase) * 3;
  const x = f.x, y = f.y + bob;
  ctx.save();
  ctx.translate(x, y);

  // Тело
  ctx.fillStyle = '#3d8a3a';
  ctx.beginPath();
  ctx.ellipse(0, 4, 26, 18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#5aad52';
  ctx.beginPath();
  ctx.ellipse(-4, -2, 16, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  // Глаза
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(-14, -10, 9, 0, Math.PI * 2);
  ctx.arc(14, -10, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1a2e16';
  ctx.beginPath();
  ctx.arc(-16, -12, 4, 0, Math.PI * 2);
  ctx.arc(12, -12, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(-18, -14, 1.8, 0, Math.PI * 2);
  ctx.arc(10, -14, 1.8, 0, Math.PI * 2);
  ctx.fill();

  // Рот
  ctx.strokeStyle = '#1d3a1a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, 9, 0.1, Math.PI - 0.1);
  ctx.stroke();

  // Лапки
  ctx.fillStyle = '#327a2f';
  ctx.beginPath();
  ctx.ellipse(-18, 8, 6, 4, 0.3, 0, Math.PI * 2);
  ctx.ellipse(18, 8, 6, 4, -0.3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawPlayer() {
  const x = player.x, y = player.y;
  ctx.save();
  ctx.translate(x, y);

  // Тень
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.beginPath();
  ctx.ellipse(0, 48, 32, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // Ноги
  ctx.strokeStyle = '#edb09a';
  ctx.lineWidth = 12;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-10, 30);
  ctx.lineTo(-14, 46);
  ctx.moveTo(10, 30);
  ctx.lineTo(14, 46);
  ctx.stroke();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(-18, 47);
  ctx.lineTo(-6, 47);
  ctx.moveTo(6, 47);
  ctx.lineTo(18, 47);
  ctx.stroke();

  // Платье
  ctx.fillStyle = '#fad9c9';
  ctx.beginPath();
  ctx.moveTo(-20, 0);
  ctx.quadraticCurveTo(0, -8, 20, 0);
  ctx.lineTo(30, 32);
  ctx.lineTo(-30, 32);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#fff5ee';
  ctx.beginPath();
  ctx.moveTo(-16, 4);
  ctx.lineTo(16, 4);
  ctx.lineTo(20, 26);
  ctx.lineTo(-20, 26);
  ctx.closePath();
  ctx.fill();

  // Руки
  ctx.strokeStyle = '#edb09a';
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(-20, 6);
  ctx.lineTo(-34, 20);
  ctx.moveTo(20, 6);
  ctx.lineTo(34, 18);
  ctx.stroke();

  // Шея
  ctx.fillStyle = '#edb09a';
  ctx.fillRect(-6, -10, 12, 12);

  // Голова
  ctx.fillStyle = '#edb09a';
  ctx.beginPath();
  ctx.arc(0, -30, 26, 0, Math.PI * 2);
  ctx.fill();

  // Уши
  ctx.fillStyle = '#edb09a';
  ctx.beginPath();
  ctx.arc(-24, -30, 5, 0, Math.PI * 2);
  ctx.arc(24, -30, 5, 0, Math.PI * 2);
  ctx.fill();

  // Зелёные волосы (Ангелина)
  ctx.fillStyle = '#3ca85a';
  ctx.beginPath();
  ctx.arc(0, -38, 32, Math.PI * 0.85, Math.PI * 2.15);
  ctx.lineTo(28, -6);
  ctx.quadraticCurveTo(14, -12, 10, 0);
  ctx.quadraticCurveTo(0, -8, -10, 0);
  ctx.quadraticCurveTo(-14, -12, -28, -6);
  ctx.closePath();
  ctx.fill();

  // Чёлка
  ctx.beginPath();
  ctx.moveTo(-26, -34);
  ctx.quadraticCurveTo(-18, -62, 0, -62);
  ctx.quadraticCurveTo(20, -60, 28, -38);
  ctx.quadraticCurveTo(16, -48, 10, -38);
  ctx.quadraticCurveTo(4, -50, -2, -38);
  ctx.quadraticCurveTo(-10, -48, -16, -36);
  ctx.closePath();
  ctx.fill();

  // Боковые пряди
  ctx.fillStyle = '#3ca85a';
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-22, -46);
  ctx.quadraticCurveTo(-32, -26, -24, -8);
  ctx.moveTo(22, -46);
  ctx.quadraticCurveTo(32, -26, 24, -8);
  ctx.stroke();

  // Глаза
  ctx.fillStyle = '#1f341a';
  ctx.beginPath();
  ctx.arc(-9, -32, 3, 0, Math.PI * 2);
  ctx.arc(9, -32, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(-11, -34, 1.2, 0, Math.PI * 2);
  ctx.arc(7, -34, 1.2, 0, Math.PI * 2);
  ctx.fill();

  // Румянец
  ctx.fillStyle = 'rgba(230,130,130,0.3)';
  ctx.beginPath();
  ctx.ellipse(-14, -24, 6, 3, 0, 0, Math.PI * 2);
  ctx.ellipse(14, -24, 6, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // Улыбка
  ctx.strokeStyle = '#b05a5a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, -22, 7, 0.15, Math.PI - 0.15);
  ctx.stroke();

  // Бантик
  ctx.fillStyle = '#d7f0c8';
  ctx.beginPath();
  ctx.ellipse(-28, -52, 9, 5, -0.5, 0, Math.PI * 2);
  ctx.ellipse(-16, -52, 9, 5, 0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1f341a';
  ctx.beginPath();
  ctx.arc(-22, -52, 3, 0, Math.PI * 2);
  ctx.fill();

  // Табличка "Ангелина"
  roundRect(-54, -96, 108, 28, 8, '#fffdf6', '#2a4a22');
  ctx.fillStyle = '#2a4a22';
  ctx.font = 'bold 16px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Ангелина', 0, -82);

  // Сачок
  ctx.strokeStyle = '#7a6542';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(28, 12);
  ctx.lineTo(60, -30);
  ctx.stroke();
  ctx.strokeStyle = '#e6eadf';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.ellipse(68, -42, 20, 15, -0.5, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(38,53,31,0.3)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(56, -50);
  ctx.lineTo(80, -34);
  ctx.moveTo(58, -36);
  ctx.lineTo(78, -50);
  ctx.stroke();

  ctx.restore();
}

// --- Отрисовка победы (танец и хоровод) ---
function drawVictory() {
  victoryTimer++;
  const cx = player.x, cy = player.y;

  // Девочка подпрыгивает
  const bounce = Math.sin(victoryTimer * 0.08) * 8;
  const rotate = Math.sin(victoryTimer * 0.05) * 0.06;

  ctx.save();
  ctx.translate(cx, cy + bounce);
  ctx.rotate(rotate);

  // Тень
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.beginPath();
  ctx.ellipse(0, 48, 35, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // Платье
  ctx.fillStyle = '#fad9c9';
  ctx.beginPath();
  ctx.moveTo(-20, 0);
  ctx.quadraticCurveTo(0, -8, 20, 0);
  ctx.lineTo(30, 32);
  ctx.lineTo(-30, 32);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#fff5ee';
  ctx.beginPath();
  ctx.moveTo(-16, 4);
  ctx.lineTo(16, 4);
  ctx.lineTo(20, 26);
  ctx.lineTo(-20, 26);
  ctx.closePath();
  ctx.fill();

  // Голова
  ctx.fillStyle = '#edb09a';
  ctx.beginPath();
  ctx.arc(0, -30, 26, 0, Math.PI * 2);
  ctx.fill();

  // Волосы (зелёные)
  ctx.fillStyle = '#3ca85a';
  ctx.beginPath();
  ctx.arc(0, -38, 32, Math.PI * 0.85, Math.PI * 2.15);
  ctx.lineTo(28, -6);
  ctx.quadraticCurveTo(14, -12, 10, 0);
  ctx.quadraticCurveTo(0, -8, -10, 0);
  ctx.quadraticCurveTo(-14, -12, -28, -6);
  ctx.closePath();
  ctx.fill();

  // Чёлка
  ctx.beginPath();
  ctx.moveTo(-26, -34);
  ctx.quadraticCurveTo(-18, -62, 0, -62);
  ctx.quadraticCurveTo(20, -60, 28, -38);
  ctx.quadraticCurveTo(16, -48, 10, -38);
  ctx.quadraticCurveTo(4, -50, -2, -38);
  ctx.quadraticCurveTo(-10, -48, -16, -36);
  ctx.closePath();
  ctx.fill();

  // Глаза
  ctx.fillStyle = '#1f341a';
  ctx.beginPath();
  ctx.arc(-9, -32, 3, 0, Math.PI * 2);
  ctx.arc(9, -32, 3, 0, Math.PI * 2);
  ctx.fill();

  // Улыбка
  ctx.strokeStyle = '#b05a5a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, -22, 7, 0.15, Math.PI - 0.15);
  ctx.stroke();

  // Табличка
  roundRect(-54, -96, 108, 28, 8, '#fffdf6', '#2a4a22');
  ctx.fillStyle = '#2a4a22';
  ctx.font = 'bold 16px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Ангелина', 0, -82);

  ctx.restore();

  // Хоровод лягушек
  const radius = 120 + Math.sin(victoryTimer * 0.02) * 15;
  for (let i = 0; i < 10; i++) {
    const angle = (i / 10) * Math.PI * 2 + victoryTimer * 0.025;
    const fx = cx + Math.cos(angle) * radius;
    const fy = cy + Math.sin(angle) * radius * 0.6 - 10 + Math.sin(victoryTimer * 0.05 + i) * 6;
    ctx.save();
    ctx.translate(fx, fy);
    ctx.fillStyle = '#3d8a3a';
    ctx.beginPath();
    ctx.ellipse(0, 4, 18, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#5aad52';
    ctx.beginPath();
    ctx.ellipse(-3, -1, 11, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(-10, -8, 7, 0, Math.PI * 2);
    ctx.arc(10, -8, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a2e16';
    ctx.beginPath();
    ctx.arc(-11, -10, 3, 0, Math.PI * 2);
    ctx.arc(9, -10, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Надпись
  ctx.fillStyle = 'rgba(255,255,220,0.9)';
  ctx.font = 'bold 48px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.3)';
  ctx.shadowBlur = 20;
  ctx.fillText('🎉 Уровень пройден! 🎉', W / 2, 70);
  ctx.shadowBlur = 0;

  // Кнопка "Следующий уровень"
  roundRect(W/2 - 120, H - 80, 240, 54, 16, '#f5d742', '#2a4a22');
  ctx.fillStyle = '#2a4a22';
  ctx.font = 'bold 22px Arial';
  ctx.fillText('➜ Следующий уровень', W/2, H - 53);
}

// --- Основной цикл рисования ---
function draw() {
  ctx.clearRect(0, 0, W, H);
  drawField();

  if (!victory) {
    frogs.forEach(drawFrog);
    drawPlayer();

    if (caughtAnim > 0) {
      ctx.fillStyle = `rgba(255,255,220,${caughtAnim / 30})`;
      ctx.font = 'bold 40px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('+1 поймана! 🎉', W / 2, 80);
      caughtAnim--;
    }
  } else {
    drawVictory();
  }
}

// --- Логика ---
function update(dt) {
  if (victory) return;

  // Движение игрока к мышке
  const dx = mouseX - player.x;
  const dy = mouseY - player.y;
  const dist = Math.hypot(dx, dy);
  if (dist > 2) {
    const speed = Math.min(300 * dt, dist);
    player.x += (dx / dist) * speed;
    player.y += (dy / dist) * speed;
  }
  player.x = Math.max(40, Math.min(W - 40, player.x));
  player.y = Math.max(110, Math.min(H - 40, player.y));

  // Проверка столкновения с лягушками
  if (!activeFrog && !modal.classList.contains('hidden')) return;
  for (const f of frogs) {
    if (Math.hypot(player.x - f.x, player.y - f.y) < 65) {
      askQuestion(f);
      break;
    }
  }
}

function askQuestion(f) {
  if (activeFrog || victory) return;
  activeFrog = f;
  const a = Math.floor(Math.random() * 9) + 1;
  const b = multiplier;
  question = { a, b, answer: a * b };
  exampleDiv.textContent = `${a} × ${b} = ?`;
  answerInput.value = '';
  msgDiv.textContent = '';
  modal.classList.remove('hidden');
  setTimeout(() => answerInput.focus(), 80);
}

function submitAnswer() {
  if (!activeFrog || !question) return;
  const val = Number(answerInput.value);
  const idx = frogs.indexOf(activeFrog);
  if (idx === -1) { closeModal(); return; }

  if (val === question.answer) {
    // Верно!
    score++;
    frogs.splice(idx, 1);
    caughtAnim = 30;
    msgDiv.textContent = '✅ Верно! Лягушка поймана!';
    msgDiv.style.color = '#28743a';

    if (score >= totalFrogs) {
      // Победа!
      victory = true;
      victoryTimer = 0;
      gameActive = false;
      updateUI();
      setTimeout(() => {
        closeModal();
        modal.classList.add('hidden');
      }, 400);
    } else {
      // Спавним новую лягушку
      frogs.push(spawnFrog(true));
      updateUI();
      setTimeout(closeModal, 500);
    }
  } else {
    // Неверно — лягушка прыгает
    const newFrog = spawnFrog(true);
    frogs[idx] = newFrog;
    msgDiv.textContent = '❌ Неверно! Лягушка упрыгала!';
    msgDiv.style.color = '#a33c32';
    setTimeout(closeModal, 800);
  }
}

function closeModal() {
  modal.classList.add('hidden');
  activeFrog = null;
  question = null;
}

function nextLevel() {
  level++;
  multiplier = parseInt(multiplierSelect.value);
  initLevel();
  updateUI();
  modal.classList.add('hidden');
}

// --- События ---
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  mouseX = (e.clientX - rect.left) * scaleX;
  mouseY = (e.clientY - rect.top) * scaleY;
  mouseX = Math.max(30, Math.min(W - 30, mouseX));
  mouseY = Math.max(110, Math.min(H - 40, mouseY));
});

canvas.addEventListener('mouseleave', () => {
  // не уводим персонажа
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !modal.classList.contains('hidden')) {
    submitAnswer();
  }
});

document.getElementById('check').onclick = submitAnswer;

// Клик по canvas для "Следующий уровень" в режиме победы
canvas.addEventListener('click', (e) => {
  if (victory) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    const cx = (e.clientX - rect.left) * scaleX;
    const cy = (e.clientY - rect.top) * scaleY;
    if (cx > W/2 - 120 && cx < W/2 + 120 && cy > H - 80 && cy < H - 26) {
      nextLevel();
    }
  }
});

multiplierSelect.addEventListener('change', () => {
  // Меняем множитель для текущего уровня (сброс не делаем)
  multiplier = parseInt(multiplierSelect.value);
  // Если игра не активна (победа) — не мешаем
});

// --- Запуск ---
initLevel();

// --- Цикл ---
let lastTime = performance.now();
function gameLoop(time) {
  const dt = Math.min(0.05, (time - lastTime) / 1000);
  lastTime = time;

  if (!victory && !modal.classList.contains('hidden')) {
    // Обновляем только позицию мыши, но не двигаем игрока в режиме вопроса
    // Игрок заморожен во время вопроса
  } else if (!victory) {
    update(dt);
  }

  draw();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
